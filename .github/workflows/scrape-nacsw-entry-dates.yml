name: Backfill NACSW Entry Dates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"  # Mondays at 14:00 UTC
    - cron: "0 14 * * 4"  # Thursdays at 14:00 UTC

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pypdf
          python -c "from pypdf import PdfReader; print('pypdf OK')"

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Run Crawl4AI setup
        run: crawl4ai-setup

      - name: Run entry date backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scrapers/nacsw-entry-dates.py
