name: Backfill NACSW Entry Dates

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"  # Daily at 12:00 UTC (2 hours after main NACSW scraper)

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer system dependencies
        run: npx puppeteer browsers install chrome

      - name: Run entry date backfill
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scrapers/nacsw-entry-dates.js

      - name: Upload compliance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entry-dates-log-${{ github.run_id }}
          path: logs/
          retention-days: 90
