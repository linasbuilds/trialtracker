name: Scrape NACSW Trials

on:
  schedule:
    # Runs every Monday at 8:00 AM UTC (3:00 AM CT / 2:00 AM MT)
    - cron: "0 8 * * 1"
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    name: Fetch & Post NACSW Trials
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm ci || npm install
          npm install puppeteer @supabase/supabase-js

      - name: Run NACSW scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BROWSE_AI_WEBHOOK_SECRET: ${{ secrets.BROWSE_AI_WEBHOOK_SECRET }}
        run: node scripts/scrape-nacsw.js
