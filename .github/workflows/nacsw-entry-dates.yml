name: NACSW Entry Date Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 1"  # Mondays at 14:00 UTC
    - cron: "0 14 * * 4"  # Thursdays at 14:00 UTC

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install crawl4ai supabase pdfplumber httpx

      - name: Install Playwright browser
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run entry date scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scrapers/nacsw-entry-dates.py
